<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#09090b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>

    <!-- Metallic Emerald to Cyan Gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  
  <!-- Subtle Outer Accent Ring (Safe Zone Line) -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="url(#emblemGrad)" stroke-opacity="0.15" stroke-width="3"/>

  <!-- Centered Safe Zone Dumbbell Icon (Scaled to 55% of canvas) -->
  <g transform="translate(256 256) rotate(-45) translate(-256 -256)" filter="url(#glow)">
    
    <!-- Central Bar -->
    <rect x="232" y="140" width="48" height="232" rx="24" fill="url(#emblemGrad)" />

    <!-- Top Dumbbell Plates -->
    <rect x="156" y="140" width="200" height="44" rx="22" fill="url(#emblemGrad)" />
    <rect x="176" y="96" width="160" height="36" rx="18" fill="url(#emblemGrad)" opacity="0.9" />

    <!-- Bottom Dumbbell Plates -->
    <rect x="156" y="328" width="200" height="44" rx="22" fill="url(#emblemGrad)" />
    <rect x="176" y="380" width="160" height="36" rx="18" fill="url(#emblemGrad)" opacity="0.9" />

  </g>

  <!-- Elegant AI Sparkle Badge (Top Right Safe Corner) -->
  <path d="M 360 130 Q 360 160 390 160 Q 360 160 360 190 Q 360 160 330 160 Q 360 160 360 130 Z" fill="#38bdf8"/>
  <circle cx="395" cy="125" r="5" fill="#34d399"/>
</svg>